{% extends "base.html" %}
{% block content %}
    <div class="vse">
        <div class="swag">
            <h1 class="nevozmozhno">Наши специалисты</h1>
            <div class="persona">
                {# список service_types задан в __init__.py (SERVICES) #}
                {% for s in service_types %}
                <a href="{{ url_for('service_list', slug = s.slug) }}" class="vibor">
                    <img class="sayoma" src="{{ url_for('static', filename = s.image, v=1) }}" alt="">
                    <p class="name">{{ s.title }}</p>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
{% endblock %}
